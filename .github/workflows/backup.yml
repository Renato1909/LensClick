name: Backup do D1

# Iniciativa 5.2 do roadmap: backup automatico do D1 com restauracao testada.
# Executa diariamente e tambem pode ser disparado manualmente.
# O procedimento completo, incluindo a restauracao, esta em docs/BACKUP_D1.md.

on:
  schedule:
    # 03:17 UTC - horario fora do pico, deliberadamente fora do minuto exato
    # para nao concorrer com outras execucoes agendadas na plataforma.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Descartar backups com mais de N dias'
        required: false
        default: '30'
        type: string

permissions:
  contents: read

concurrency:
  group: backup-d1
  # Um backup em andamento nunca deve ser cancelado no meio: isso deixaria
  # um arquivo parcial no R2 e passaria falsa sensacao de seguranca.
  cancel-in-progress: false

jobs:
  backup:
    name: Exportar o D1 e arquivar no R2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_BUCKET: lensclick-backups
      BACKUP_PREFIX: daily
      DATABASE_NAME: lensclick-db

    steps:
      # Somente CLOUDFLARE_API_TOKEN e obrigatorio. O account id e resolvido a
      # partir do proprio token quando o segredo opcional nao estiver definido,
      # o que reduz a configuracao manual a um unico segredo.
      - name: Conferir o token e resolver a conta
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::O segredo CLOUDFLARE_API_TOKEN nao esta configurado. Veja docs/BACKUP_D1.md."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID ausente - resolvendo a partir do token."
            CONTA="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts?per_page=100" \
              | jq -r '.result[0].id')"
            if [ -z "$CONTA" ] || [ "$CONTA" = "null" ]; then
              echo "::error::Nao foi possivel resolver o account id a partir do token."
              exit 1
            fi
            echo "CLOUDFLARE_ACCOUNT_ID=${CONTA}" >> "$GITHUB_ENV"
            echo "Conta resolvida: ${CONTA}"
          else
            echo "Usando o CLOUDFLARE_ACCOUNT_ID informado."
          fi

      - name: Baixar o codigo
        uses: actions/checkout@v7

      - name: Preparar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias de forma reproduzivel
        run: npm ci

      # Cria o bucket quando ele ainda nao existe. A falha e tolerada porque o
      # token pode nao ter permissao de criacao - a verificacao autoritativa e
      # o envio do arquivo, que falha ruidosamente se o bucket nao existir.
      - name: Garantir o bucket de backup
        run: |
          set -uo pipefail
          if npx wrangler r2 bucket create "$BACKUP_BUCKET"; then
            echo "Bucket ${BACKUP_BUCKET} criado."
          else
            echo "::warning::Nao foi possivel criar ${BACKUP_BUCKET}. Pode ja existir ou o token pode nao ter permissao de criacao. O envio do arquivo confirmara."
          fi

      - name: Exportar o banco remoto
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          ARQUIVO="backup-${STAMP}.sql"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"
          echo "ARQUIVO=${ARQUIVO}" >> "$GITHUB_ENV"

          npx wrangler d1 export "$DATABASE_NAME" --remote --output "$ARQUIVO" -y

          # Um export vazio ou zerado nao e evidencia de sucesso: falha aqui
          # para que o workflow nao arquive um backup inutil.
          test -s "$ARQUIVO"
          echo "Export concluido: $(wc -c < "$ARQUIVO") bytes"

      - name: Enviar para o R2
        run: |
          set -euo pipefail
          npx wrangler r2 object put \
            "${BACKUP_BUCKET}/${BACKUP_PREFIX}/${ARQUIVO}" \
            --remote \
            --file "$ARQUIVO" \
            --content-type "application/sql"
          echo "Arquivado em ${BACKUP_BUCKET}/${BACKUP_PREFIX}/${ARQUIVO}"

      - name: Confirmar objeto no R2 remoto
        run: |
          set -euo pipefail
          OBJETO="${BACKUP_PREFIX}/${ARQUIVO}"
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BACKUP_BUCKET}/objects"
          LISTA="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${BASE}?prefix=${OBJETO}&per_page=100")"

          if ! printf '%s' "$LISTA" | jq -e --arg objeto "$OBJETO" \
            '.success == true and any(.result[]?; .key == $objeto)' > /dev/null; then
            echo "::error::O objeto ${OBJETO} nao foi localizado no bucket R2 remoto."
            exit 1
          fi

          echo "Objeto remoto confirmado: ${BACKUP_BUCKET}/${OBJETO}"

      - name: Aplicar a retencao
        run: |
          set -euo pipefail
          DIAS="${{ inputs.retention_days || '30' }}"
          CORTE="$(date -u -d "${DIAS} days ago" +%s)"
          echo "Retencao de ${DIAS} dias - descartando anteriores a $(date -u -d "@${CORTE}" +%Y-%m-%dT%H:%M:%SZ)"

          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BACKUP_BUCKET}/objects"
          LISTA="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${BASE}?prefix=${BACKUP_PREFIX}/&per_page=1000")"

          if [ "$(printf '%s' "$LISTA" | jq -r '.success')" != "true" ]; then
            echo "::error::Falha ao listar os objetos do bucket de backup."
            printf '%s' "$LISTA" | jq -r '.errors[]? | "- \(.message)"'
            exit 1
          fi

          # A data e obtida do nome controlado pelo proprio workflow. Isso evita
          # depender de metadados opcionais da API e preserva qualquer objeto
          # que nao siga exatamente o padrao dos backups diarios.
          printf '%s' "$LISTA" \
            | jq -c --arg prefix "$BACKUP_PREFIX" --argjson corte "$CORTE" '
                .result[]
                | select(.key | test("^" + $prefix + "/backup-[0-9]{8}T[0-9]{6}Z\\.sql$"))
                | . as $objeto
                | (.key
                    | capture("backup-(?<stamp>[0-9]{8}T[0-9]{6}Z)\\.sql$").stamp
                    | strptime("%Y%m%dT%H%M%SZ")
                    | mktime) as $criado
                | select($criado < $corte)
                | { key: $objeto.key }' \
            | while read -r linha; do
                chave="$(printf '%s' "$linha" | jq -r '.key')"
                echo "Descartando ${chave}"
                codificado="$(jq -rn --arg k "$chave" '$k | @uri')"
                curl --fail --silent --show-error -X DELETE \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  "${BASE}/${codificado}" > /dev/null
              done

          echo "Retencao aplicada."

      - name: Resumo da execucao
        run: |
          {
            echo "### Backup do D1"
            echo ""
            echo "- Banco: \`${DATABASE_NAME}\` (remoto)"
            echo "- Arquivo: \`${BACKUP_PREFIX}/${ARQUIVO}\`"
            echo "- Destino: bucket R2 \`${BACKUP_BUCKET}\`"
            echo "- Retencao: ${{ inputs.retention_days || '30' }} dias"
          } >> "$GITHUB_STEP_SUMMARY"
