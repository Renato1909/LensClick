name: Qualidade

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes-e-validacao:
    name: Testes e validação
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências de forma reproduzível
        run: npm ci

      - name: Executar testes automatizados
        run: npm test

      - name: Executar o lint do frontend
        run: npm run lint

      - name: Validar a configuração do Worker
        run: npm run check

      # O LensClick não tem dependências de runtime, então o audit relevante é o
      # dev-inclusive (é onde moram undici/sharp/miniflare, via wrangler).
      # Informativo de propósito: o npm audit consulta um serviço externo e não
      # deve bloquear um PR por indisponibilidade do registry. O gate que
      # bloqueia é o do job diário (smoke-diario.yml).
      - name: Auditar dependências de desenvolvimento (informativo)
        continue-on-error: true
        run: npm audit --audit-level=high

  # Iniciativa 5.6.a do roadmap: preview local com smoke ponta a ponta.
  # Sobe o Worker com D1 local migrado e executa o smoke HTTP contra ele,
  # para que PRs sejam validados em ambiente real antes do merge.
  preview:
    name: Preview local com smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências de forma reproduzível
        run: npm ci

      - name: Aplicar migrations no D1 local
        run: npm run db:migrate:local

      - name: Subir o Worker local em segundo plano
        run: |
          set -euo pipefail
          (npx wrangler dev --local --port 4174 > worker-preview.log 2>&1 &)
          for tentativa in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/api/health > /dev/null; then
              echo "Worker local pronto após ${tentativa} tentativa(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::O Worker local não respondeu em 60 segundos."
          cat worker-preview.log
          exit 1

      - name: Executar o smoke contra o preview
        run: npm run test:smoke

      - name: Executar os testes de navegador contra o preview
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Encerrar o Worker local
        if: always()
        run: pkill -f "wrangler dev --local --port 4174" || true

